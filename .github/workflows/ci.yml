name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build -w @takeon/engine
      - run: npm test -w @takeon/engine
      - run: npm run build -w @takeon/pixi
      - run: npm run build -w takeon-web

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: pocketbase/go.sum
      - run: go build ./... && go vet ./... && go test ./...
        working-directory: pocketbase
