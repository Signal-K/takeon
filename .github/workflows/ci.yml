name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  engine-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build -w @takeon/engine
      - run: npm test -w @takeon/engine
      - run: npm run build -w @takeon/pixi
      - run: npm run build -w takeon-web

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: pocketbase/go.sum
      - run: go build ./... && go vet ./... && go test ./...
        working-directory: pocketbase

  # Publishes @takeon/engine and @takeon/pixi to npmjs.org when a v* tag is
  # pushed. Requires the NPM_TOKEN repo secret (an npm automation token with
  # publish rights on the @takeon scope). Idempotent: versions already on the
  # registry are skipped, so re-running a tag build never fails on republish.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [engine-and-web, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm run build -w @takeon/engine && npm test -w @takeon/engine
      - run: npm run build -w @takeon/pixi
      - name: Publish packages not yet on the registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in @takeon/engine @takeon/pixi; do
            version=$(npm pkg get version -w "$pkg" | node -e "process.stdin.once('data',d=>console.log(Object.values(JSON.parse(d))[0]))")
            if npm view "$pkg@$version" version >/dev/null 2>&1; then
              echo "$pkg@$version already published — skipping"
            else
              npm publish -w "$pkg" --access public
            fi
          done
